<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estreou Hoje</title>
<meta name="description" content="As campanhas publicitárias que estrearam hoje e nos últimos dias, no mundo inteiro, com modo teatro para assistir os filmes em sequência.">
<meta property="og:title" content="Estreou Hoje">
<meta property="og:description" content="As campanhas publicitárias que estrearam hoje e nos últimos dias, no mundo inteiro, com modo teatro para assistir os filmes em sequência.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="eh">
  <div class="eh-wrap">
    <header class="eh-mast">
      <h1>Estreou <span>Hoje</span></h1>
      <p>Campanhas publicadas por agências, veículos e páginas de publicidade no mundo inteiro. <strong id="updated"></strong></p>
    </header>

    <nav class="eh-strip" id="strip" aria-label="Hoje e os cinco dias anteriores"></nav>

    <div class="eh-body">
      <main>
        <div class="eh-viewbar">
          <h2 id="view-title">Hoje e os últimos 5 dias</h2>
          <div class="eh-actions">
            <button type="button" class="eh-back" id="back" hidden>Voltar para os últimos 6 dias</button>
            <button type="button" class="eh-theater-btn" id="open-theater">▶ Modo teatro</button>
          </div>
        </div>
        <p class="eh-status" id="status" role="status">Carregando campanhas…</p>
        <div id="feed"></div>
      </main>

      <aside class="eh-side">
        <section class="eh-panel" aria-label="Calendário">
          <h2>Escolher um dia</h2>
          <div class="eh-cal-head">
            <button type="button" class="eh-nav" id="prev" aria-label="Mês anterior">‹</button>
            <strong id="cal-title"></strong>
            <button type="button" class="eh-nav" id="next" aria-label="Próximo mês">›</button>
          </div>
          <div class="eh-cal" id="cal"></div>
          <p class="eh-legend"><i></i> dia com campanhas registradas</p>
        </section>
        <section class="eh-panel" aria-label="Filtro por região">
          <h2>Região</h2>
          <div class="eh-chips" id="chips"></div>
        </section>
      </aside>
    </div>
  </div>
</div>
<script src="app.js?v=2"></script>
</body>
</html>

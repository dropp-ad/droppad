name: Teste da ficha técnica (ramo creditos)

on:
  push:
    branches: [creditos]

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 1) o robô da ficha técnica em 40 campanhas (sem gravar nada no site)
      - run: CREDITOS_POR_RODADA=40 python robo/creditos.py | tail -25
      # 2) monta o site com as fichas achadas e tira prints de uma página de campanha e de uma pessoa
      - run: |
          python robo/creditos.py --aplicar
          mkdir _site && cp -r index.html style.css app.js favicon.svg _site/ && python3 tools/feed.py campaigns.json _site && python3 tools/paginas.py campaigns.json _site
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          (cd _site && python -m http.server 8000 >/dev/null 2>&1 &) && sleep 2
          C=$(python3 -c "import json;c=json.load(open('campaigns.json'));print(next(x['id'] for x in c if x['id'].startswith('2026-11-17-leroy-merlin-sua-casa')))")
          mkdir prints && python tools/print_site.py "[\"http://localhost:8000/c/$C/\", \"http://localhost:8000/p/charles-alvarenga/\"]"
          cd prints && git init -q -b diagnostico && git config user.name robo && git config user.email robo@x
          git add -A && git commit -qm prints && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico

name: Teste da ficha técnica (ramo creditos)

on:
  push:
    branches: [creditos]

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/espiar.py https://clubedecriacao.com.br/ https://clubedecriacao.com.br/feed/ https://www.linkedin.com/in/rian-swart-425570143/

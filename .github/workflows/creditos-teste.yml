name: Teste da ficha técnica (ramo creditos)

on:
  push:
    branches: [creditos]

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          curl -s "https://clubedecriacao.com.br/wp-json/wp/v2/acervo?per_page=2" | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)
          for x in d:
              print('KEYS', sorted(x.keys()))
              print('DATE', x.get('date'), 'LINK', x.get('link'))
              print('TITLE', x['title']['rendered'])
              print('ACF', json.dumps(x.get('acf'), ensure_ascii=False)[:1500])
              print('CONTENT', re.sub(r'\s+',' ',x['content']['rendered'])[:2500])
              print('TAX', {k:x.get(k) for k in x if isinstance(x.get(k), list) and k not in ('class_list',)})
          "
          curl -sI "https://clubedecriacao.com.br/wp-json/wp/v2/acervo?per_page=100" | grep -i "x-wp-total"
          curl -s "https://clubedecriacao.com.br/wp-json/wp/v2/ultima?per_page=3" | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)
          for x in d:
              print('U-TITLE', x['title']['rendered'], x.get('date'), x.get('link'))
              print('U-ACF', json.dumps(x.get('acf'), ensure_ascii=False)[:600])
              print('U-CONTENT', re.sub(r'\s+',' ',x['content']['rendered'])[:1200])
              print('U-TAX', {k:x.get(k) for k in x if isinstance(x.get(k), list) and k not in ('class_list',)})
          "
          curl -sI "https://clubedecriacao.com.br/wp-json/wp/v2/ultima?per_page=100" | grep -i "x-wp-total"

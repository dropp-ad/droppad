name: Prints do site (diagnóstico)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Lista JSON de endereços"
        required: true

jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir prints && python tools/print_site.py '${{ inputs.urls }}'
      - uses: actions/upload-artifact@v4
        with:
          name: prints
          path: prints

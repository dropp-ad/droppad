name: Prints do site (diagnóstico)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Lista JSON de endereços"
        required: true

jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir prints && python tools/print_site.py '${{ inputs.urls }}'
      # guarda os prints num ramo separado ("diagnostico"), fora do site
      - run: |
          cd prints
          git init -q -b diagnostico
          git config user.name "droppad robô"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "prints $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico

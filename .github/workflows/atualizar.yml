name: Atualizar droppad

# Trabalho pesado, sem Claude, de hora em hora (minuto 17, fora do pico do GitHub):
# arquivo histórico, buscas por sites novos, capas e carrosséis das campanhas antigas.
# As campanhas novas do dia entram pelo vigia (vigia.yml), que varre tudo a cada minuto.
# Se não houver nada novo, não publica.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica nada)"
        type: boolean
        default: false
      inspecionar:
        description: "URLs para inspecionar (separadas por espaço); não publica nada"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: atualizar-ad-drop
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspecionar matérias
        if: ${{ inputs.inspecionar }}
        env:
          URLS: ${{ inputs.inspecionar }}
        run: SEM_TRADUCAO=1 python robo/inspecionar.py $URLS

      - name: Buscar campanhas e publicar
        if: ${{ !inputs.inspecionar }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULAR: ${{ inputs.simular && '1' || '' }}
        run: |
          git config user.name "droppad robô"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            python robo/atualizar.py
            if [ -n "$SIMULAR" ]; then exit 0; fi
            git add campaigns.json novidades.json robo/estado.json robo/fontes.json
            if git diff --cached --quiet; then
              echo "Nada novo."
              exit 0
            fi
            git commit -q -m "Atualiza campanhas de $(TZ=America/Sao_Paulo date +%F) (robô)"
            if git push origin HEAD:main; then
              gh workflow run publicar.yml -R "${{ github.repository }}" --ref main >/dev/null 2>&1 || true
              exit 0
            fi
            echo "Push recusado; pegando a versão nova e refazendo ($tentativa/3)."
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          exit 1

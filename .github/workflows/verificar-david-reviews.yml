name: Verificar David Reviews
on:
  push:
    branches: [main]
    paths: [.github/workflows/verificar-david-reviews.yml]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar acesso e leitura de reviews
        run: |
          set -o pipefail
          PYTHONPATH=robo python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import concurrent.futures
          import atualizar as a

          url = "https://www.davidreviews.com/Reviews/"
          try:
              pagina = a.baixar(url, timeout=20)
          except Exception as e:
              print(f"::error::Acesso à fonte: {type(e).__name__} {e}")
              raise
          links = a.links_reviews(url, pagina)
          print(f"::notice::Fonte acessível. Links encontrados: {len(links)}")
          import re
          from html import unescape
          for link in list(links)[:3]:
              review = a.baixar(link, timeout=15)
              title = re.search(r"<title[^>]*>(.*?)</title>", review, re.I | re.S)
              print("::notice::TITLE " + (a.limpar(title[1]) if title else "(ausente)"))
              for line in review.splitlines():
                  if re.search(r'og:|publish|november|2026-11-|<h[12]|<video|mp4|m3u8|player', line, re.I):
                      line = unescape(re.sub(r"\s+", " ", line)).strip()
                      if 0 < len(line) < 700:
                          print("::notice::MARKUP " + line)
          PY

name: Verificar David Reviews
on:
  push:
    branches: [main]
    paths: [.github/workflows/verificar-david-reviews.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: atualizar-ad-drop
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ler reviews de hoje e publicar no dropp.ad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "droppad robô"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            PYTHONPATH=robo python3 - <<'PY'
          import tempfile
          from pathlib import Path
          import atualizar as a

          fontes = a.ler_json(a.FONTES, {})
          site, = [s for s in fontes["sites"] if s["nome"] == "David Reviews"]
          original, novidades = a.CAMP, a.NOVIDADES
          existentes = a.ler_json(original, [])
          revisar = a.item_review

          def somente_hoje(url):
              item = revisar(url)
              if item and item["data"] == "2026-11-27":
                  print(f"::notice::REVIEW {item['data']} | {item['titulo']} | {url}")
                  return item
              return None

          with tempfile.TemporaryDirectory() as raiz:
              raiz = Path(raiz)
              a.CAMP, a.NOVIDADES = str(raiz / "campaigns.json"), str(raiz / "novidades.json")
              a.FONTES, a.ESTADO = str(raiz / "fontes.json"), str(raiz / "estado.json")
              Path(a.CAMP).write_bytes(Path(original).read_bytes())
              # Coleta pontual da página de reviews, sem rodar as outras fontes.
              a.salvar_json(a.FONTES, {"feeds": [], "sites": [site]})
              a.fontes_dos_sites = lambda *_: []
              a.completar_imagens = a.completar_fotos = a.completar_textos = lambda *_: 0
              a.item_review = somente_hoje
              a.MAX_POR_FONTE_DIA = 40
              a.main()
              ids = {c["id"] for c in existentes}
              novos = [c for c in a.ler_json(a.CAMP, []) if c["id"] not in ids]
          assert all(c["source"] == site["nome"] and c["date"] == "2026-11-27" for c in novos)
          print(f"::notice::REVIEW novas campanhas publicáveis: {len(novos)}")
          for c in novos:
              print(f"::notice::REVIEW publicação {c['id']}")
          if novos:
              tudo = sorted([*existentes, *novos], key=lambda c: (c["date"], c.get("addedAt", "")), reverse=True)
              a.salvar_json(original, tudo)
              a.salvar_json(novidades, {"atualizado": a.AGORA.strftime("%Y-%m-%dT%H:%M:%SZ"),
                                        "total": len(tudo), "ultimo": tudo[0]["id"]})
          PY
            git add campaigns.json novidades.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publica as campanhas de hoje da David Reviews'
            if git push origin HEAD:main; then
              gh workflow run publicar.yml --ref main
              exit 0
            fi
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          exit 1

name: Publicar site

# Publica o site no GitHub Pages pelo Actions (sem o limite de 10 publicações por hora
# do modo "Deploy from a branch"). Os robôs chamam este workflow depois de cada push;
# se chegarem vários pedidos seguidos, o GitHub junta tudo numa publicação só.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar só os arquivos do site
        run: |
          mkdir _site
          cp -r index.html app.js style.css favicon.svg logo.* painel.html privacidade.html \
                campaigns.json novidades.json views.json arquivo.json .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # o GitHub às vezes falha ao achar o pacote recém-enviado ("No artifacts named github-pages");
      # nesse caso espera um pouco e tenta de novo
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

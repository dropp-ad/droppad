name: Diagnóstico do embed do Instagram

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Lista JSON de links do Instagram"
        required: true

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python tools/medir_ig.py '${{ inputs.urls }}'
      - run: MOBILE=1 python tools/medir_ig.py '${{ inputs.urls }}'

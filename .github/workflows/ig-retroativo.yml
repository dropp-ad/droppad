name: Instagram retroativo (3 meses)

# Puxa o que cada conta de Instagram monitorada postou nos últimos 90 dias.
# Roda em loop (um lote a cada 15 min, respeitando o limite da Meta) e, se não terminar
# em 5h30, chama a próxima execução sozinho. Quando todas as contas passaram, para.
on:
  schedule:
    - cron: "53 */6 * * *"   # rede de segurança, caso a corrente quebre
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: ig-retroativo
  cancel-in-progress: false

jobs:
  retroativo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler contas e publicar (em loop)
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: bash robo/ig_retro.sh

      - name: Chamar a próxima execução
        if: ${{ env.CONTINUAR == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ig-retroativo.yml -R "${{ github.repository }}" --ref main

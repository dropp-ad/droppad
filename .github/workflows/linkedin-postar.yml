name: Postar no LinkedIn

# A cada 30 min posta na Página do droppAd uma campanha que estreou hoje (via webhook do Make).
# Limites e regras em robo/linkedin_postar.py. Sem o secret LINKEDIN_WEBHOOK, não faz nada.
# Para pausar: Actions → "Postar no LinkedIn" → ⋯ → Disable workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: linkedin-postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Postar
        env:
          LINKEDIN_WEBHOOK: ${{ secrets.LINKEDIN_WEBHOOK }}
        run: python robo/linkedin_postar.py
      - name: Guardar o que já foi postado
        run: |
          git config user.name "droppad robô"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git add robo/linkedin_postar.json 2>/dev/null
            git diff --cached --quiet && exit 0
            git commit -q -m "LinkedIn: campanhas postadas ($(TZ=America/Sao_Paulo date '+%F %H:%M'), robô)"
            git push -q origin HEAD:main && exit 0
            git reset -q --soft HEAD~1
            cp robo/linkedin_postar.json /tmp/lp.json
            git stash -q; git pull -q --rebase origin main; git stash drop -q || true
            cp /tmp/lp.json robo/linkedin_postar.json
          done

name: Instagram diagnóstico
on:
  workflow_dispatch:
    inputs:
      contas:
        description: "@ separados por espaço (vazio = lista padrão)"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CONTAS: ${{ inputs.contas }}
        run: python robo/ig_diagnostico.py
